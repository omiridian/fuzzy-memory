<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Aetherlings</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8e2d0;
        --gold: #f0b040;
        --panel: #1d2230;
        --edge: #3a3f52;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d14;
        color: var(--ink);
        font-family: "Courier New", ui-monospace, monospace;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      #shell {
        height: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom))
          calc(8px + env(safe-area-inset-left));
      }
      /* The frame keeps the 3:2 shape and grows to fill whatever space it has,
         capped so the game never outruns the window in either direction. */
      #frame {
        position: relative;
        width: min(100%, calc((100dvh - 120px) * 1.5), 1600px);
        aspect-ratio: 3 / 2;
        border: 2px solid var(--edge);
        border-radius: 10px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
        background: #0b0d14;
        overflow: hidden;
        line-height: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hint {
        font-size: clamp(10px, 1.4vw, 13px);
        color: #8d8f9c;
        text-align: center;
        line-height: 1.5;
      }
      #hint b {
        color: var(--gold);
        font-weight: normal;
      }
      #fullscreen {
        position: fixed;
        top: calc(6px + env(safe-area-inset-top));
        right: calc(6px + env(safe-area-inset-right));
        background: rgba(29, 34, 48, 0.85);
        color: var(--ink);
        border: 1px solid var(--edge);
        border-radius: 6px;
        font: inherit;
        font-size: 11px;
        padding: 5px 9px;
        cursor: pointer;
        z-index: 5;
      }

      /* ── Touch pad ───────────────────────────────────────────────────────
         Hidden on machines with a mouse; shown on anything with a finger. */
      #touch {
        display: none;
        width: min(100%, 560px);
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        user-select: none;
        touch-action: none;
      }
      #dpad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        width: 45vw;
        max-width: 190px;
        aspect-ratio: 1;
      }
      #buttons {
        display: grid;
        grid-template-columns: repeat(2, auto);
        gap: 10px;
        align-items: center;
        justify-items: center;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(43, 51, 70, 0.92);
        border: 2px solid var(--edge);
        color: var(--ink);
        font-family: inherit;
        font-size: 15px;
        border-radius: 10px;
        touch-action: none;
        cursor: pointer;
      }
      .btn.down {
        background: var(--gold);
        color: #1a1a22;
        border-color: var(--gold);
      }
      #dpad .btn {
        border-radius: 8px;
      }
      .round {
        width: 62px;
        height: 62px;
        border-radius: 50%;
        font-size: 17px;
      }
      .wide {
        padding: 9px 14px;
        font-size: 12px;
        border-radius: 8px;
      }
      .spacer {
        visibility: hidden;
      }

      @media (pointer: coarse) {
        #shell {
          justify-content: space-evenly;
        }
        #touch {
          display: flex;
        }
        #hint {
          display: none;
        }
        #frame {
          width: min(100%, calc((100dvh - 250px) * 1.5));
        }
      }
      /* Landscape phone: put the pad either side of a taller game view. */
      @media (pointer: coarse) and (orientation: landscape) {
        #shell {
          gap: 4px;
        }
        #frame {
          width: min(100%, calc((100dvh - 110px) * 1.5));
        }
        #dpad {
          width: 30vw;
          max-width: 150px;
        }
        .round {
          width: 52px;
          height: 52px;
        }
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <button id="fullscreen" type="button">⛶ Fullscreen</button>
      <div id="frame">
        <canvas id="game" width="720" height="480"></canvas>
      </div>
      <div id="hint">
        <b>Arrows / WASD</b> move &nbsp;·&nbsp; <b>Z / Enter</b> confirm &nbsp;·&nbsp;
        <b>X / Esc</b> back &nbsp;·&nbsp; <b>M</b> menu &nbsp;·&nbsp; <b>Shift</b> run
      </div>
      <div id="touch">
        <div id="dpad">
          <div class="spacer"></div>
          <button class="btn" data-key="up" type="button">▲</button>
          <div class="spacer"></div>
          <button class="btn" data-key="left" type="button">◀</button>
          <div class="spacer"></div>
          <button class="btn" data-key="right" type="button">▶</button>
          <div class="spacer"></div>
          <button class="btn" data-key="down" type="button">▼</button>
          <div class="spacer"></div>
        </div>
        <div id="buttons">
          <button class="btn wide" data-key="menu" type="button">MENU</button>
          <button class="btn wide" data-key="run" type="button">RUN</button>
          <button class="btn round" data-key="cancel" type="button">X</button>
          <button class="btn round" data-key="confirm" type="button">Z</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
