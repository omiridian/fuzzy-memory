<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#08070c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Deckdelve — build a dungeon one room card at a time while four adventurers explore it in real time." />
    <title>Deckdelve</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #08070c;
        color: #e8d9b4;
        font-family: Georgia, "Times New Roman", serif;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      /* The canvas is sized in script to the exact viewport, so it needs no
         layout of its own — just a box that cannot scroll or bounce. */
      #game {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        touch-action: none;
        background: #08070c;
      }
      #nojs {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
        font-size: 15px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <noscript>
      <div id="nojs">
        <p>
          Deckdelve is a browser game and needs JavaScript.<br />
          It also needs to be served over HTTP — opening the file directly will not work.
        </p>
      </div>
    </noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
